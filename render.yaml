# Render Cloud Deployment Blueprint
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: ticketlens
    runtime: python
    region: oregon
    plan: free
    autoDeploy: true
    # Install only the lightweight serving stack (no torch), then `ticketlens.build` downloads
    # the dataset, prepares the corpus and trains the TF-IDF model, each step in its own
    # process to keep peak memory low (CI enforces < 512 MB per step). The server then binds
    # $PORT instantly and runs in ~220 MB, under the 512 MB free-plan limit.
    # The build FAILS (keeping the previous deploy live) if the Hugging Face dataset can't
    # be downloaded, instead of training on the tiny test fixture.
    buildCommand: "pip install --upgrade pip && pip install -r requirements-render.txt && PYTHONPATH=src python -m ticketlens.build"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TICKETLENS_ENV
        value: production
      - key: PYTHONPATH
        value: src:.
      - key: TICKETLENS_CONFIDENCE_THRESHOLD
        value: "0.80"
      # Optional: require an X-API-Key header on /predict. Leave unset for a public demo.
      # To enable, add TICKETLENS_API_KEY as a secret in the Render dashboard
      # (Environment tab) or uncomment below to have Render generate one.
      # - key: TICKETLENS_API_KEY
      #   generateValue: true
