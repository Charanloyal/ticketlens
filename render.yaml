# Render Cloud Deployment Blueprint
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: ticketlens
    runtime: python
    region: oregon
    plan: free
    autoDeploy: true
    # Install only the lightweight serving stack (no torch) and train the TF-IDF
    # model at build time so the server binds $PORT instantly and stays well
    # under the 512 MB free-plan memory limit.
    buildCommand: "pip install --upgrade pip && pip install -r requirements-render.txt && PYTHONPATH=src python -m ticketlens.train_baseline --mode full"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TICKETLENS_ENV
        value: production
      - key: PYTHONPATH
        value: src:.
      - key: TICKETLENS_CONFIDENCE_THRESHOLD
        value: "0.80"
