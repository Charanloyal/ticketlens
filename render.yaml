# Render Cloud Deployment Blueprint
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: ticketlens
    runtime: python
    region: oregon
    plan: free
    autoDeploy: true
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt && pip install -e ."
    startCommand: "uvicorn ticketlens.api:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TICKETLENS_ENV
        value: production
      - key: PYTHONPATH
        value: src
      - key: TICKETLENS_CONFIDENCE_THRESHOLD
        value: "0.80"
