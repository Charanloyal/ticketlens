project_name: "TicketLens"
version: "0.1.0"
random_seed: 42

dataset:
  name: "Tobi-Bueck/customer-support-tickets"
  source_url: "https://huggingface.co/datasets/Tobi-Bueck/customer-support-tickets"
  license: "CC-BY-NC-4.0"
  language: "en"
  target_column: "type" # 4 ITSM/ITIL categories: Incident, Request, Problem, Change
  text_columns:
    - "subject"
    - "body"
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  deduplicate: true
  redact_pii: true
  # quick/full modes subsample only the train/val splits (70/15 of the budget); the test split is
  # always the full held-out 15%, so every model is benchmarked on the same tickets.
  quick_mode_samples: 500
  full_mode_samples: 10000

baseline:
  model_name: "tfidf_logistic_regression"
  ngram_range: [1, 2]
  max_features: 80000
  min_df: 2
  sublinear_tf: true
  c_param: 4.0
  max_iter: 2000
  class_weight: "balanced"
  # Adds subject-only / first-sentence training samples (training split only) so the model
  # also handles short, hand-written tickets.
  augment_short_text: true

transformer:
  pretrained_model: "distilbert/distilbert-base-uncased"
  max_length: 128
  batch_size: 16
  eval_batch_size: 32
  # LoRA adapters need a higher learning rate than full fine-tuning (5e-5 barely moved the adapter).
  learning_rate: 3.0e-4
  weight_decay: 0.01
  epochs_quick: 2
  epochs_full: 3
  early_stopping_patience: 2
  use_peft: true
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.10
  lora_target_modules:
    - "q_lin"
    - "v_lin"
  device: "auto"

keras:
  # TensorFlow / Keras CNN baseline (see src/ticketlens/train_keras.py)
  max_tokens: 30000
  sequence_length: 256
  embedding_dim: 128
  conv_filters: 128
  kernel_size: 5
  dense_units: 64
  dropout: 0.3
  learning_rate: 1.0e-3
  batch_size: 64
  epochs: 10
  early_stopping_patience: 2

inference:
  confidence_threshold: 0.80 # >= 0.80: "Auto Accept", < 0.80: "Needs Review"
  default_model: "transformer"
  max_input_length: 2000
  # Strength of the ITIL keyword correction (0 disables it). See src/ticketlens/itil_rules.py.
  itil_cue_weight: 1.5

paths:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  model_dir: "artifacts/models"
  reports_dir: "reports"
  figures_dir: "reports/figures"
  fixtures_file: "data/fixtures/synthetic_tickets.json"
